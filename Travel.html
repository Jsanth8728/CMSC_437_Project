<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flight Information</title>
    <link rel="stylesheet" href="Home_Screen.css">
    <link rel="stylesheet" href="Travel.css">
    <script src="Travel.js" defer></script>
    <script src="Home_Screen.js" defer></script>
</head>

<body>
    <div class="homepage">
        <!-- Left Menu -->
        <span class="menu">
            <span>
                <a href="#">
                    <img src="images/profilepic.png" alt="Profile" class="profile-pic">
                </a>
            </span>
            <span>
                <a href="Media.html">
                    <img src="images/Clapboard.png" alt="Entertainment" class="clapboard-pic">
                </a>
            </span>
            <span>
                <a href="Travel.html">
                    <img src="images/AirplaneIcon.png" alt="Travel" class="airplane-pic">
                </a>
            </span>
            <span>
                <a href="Shopping.html">
                    <img src="images/ShoppingBag.png" alt="Shopping" class="shopping-pic">
                </a>
            </span>
            <span>
                <a href="Food.html">
                    <img src="images/ForkKnife.png" alt="Food" class="food-pic">
                </a>
            </span>
            <span>
                <a href="Help.html">
                    <img src="images/Help.png" alt="Help" class="help-pic">
                </a>
            </span>
        </span>

        <!-- Top Bar -->
        <div>
            <div class="topbar">
                <div class="announcement">Announcements</div> -->
                <div class="eta" id="eta"></div>
                <button class="login" onclick="goToLogin()">
                    Login
                </button>

                <button class="back-button" onclick="goToHome()">
                    Back
                </button>
            </div>
            <!-- Main Page -->
            <div class="flightinfo">
                <div class="flightmap">Flight Map
                    <img src="images/Map.png" alt="Flight Map" class="map">
                </div>
                <div class="flighttext">
                    <div class="eta-flight" id="etaf"></div>
                    <div class="altitude">Altitude: 35,000ft</div>
                    <div class="speed">Speed: 589mph </div>
                    <div class="time-local" id="local-time"></div>
                    <div class="time-dest" id="dest-time"></div>
                </div>
            </div>
        </div>


    </div>
</body>

</html>
